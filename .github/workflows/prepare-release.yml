name: Prepare Buildpack Releases

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump"
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

# Disable all GITHUB_TOKEN permissions, since the GitHub App token is used instead.
permissions: {}

jobs:
  prepare-release:
    uses: heroku/languages-github-actions/.github/workflows/_buildpacks-prepare-release.yml@923af913b844b3f24ec5bda007a701f6ec38a2a3 # v2.0.0
    with:
      app_id: ${{ vars.LINGUIST_GH_APP_ID }}
      bump: ${{ inputs.bump }}
      declarations_starting_version: 1.1.0
    secrets:
      app_private_key: ${{ secrets.LINGUIST_GH_PRIVATE_KEY }}
